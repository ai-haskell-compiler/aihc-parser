name: Generated Reports Update

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-generated-reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a

      - name: Cache Stackage and package downloads
        uses: actions/cache@v6
        with:
          path: |
            .cache/aihc/stackage
            .cache/aihc/hackage
          key: generated-reports-aihc-downloads-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            generated-reports-aihc-downloads-${{ runner.os }}-

      - name: Update generated reports
        run: nix run .#generate-reports

      - name: Open pull request for generated updates
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(reports): update generated reports"
          add-paths: |
            README.md
            docs/aihc-parser-supported-extensions.md
          branch: "automation/generated-reports-update"
          title: "chore(reports): update generated reports"
          body: |
            This PR was created automatically by the weekly generated reports
            workflow.

            It refreshes the README status table (parser tests, lexer tests and
            Stackage parse coverage) and the generated extension support
            documentation.
